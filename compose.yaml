services:
  game:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      DATABASE_PATH: /app/data/asteria.sqlite
      ALLOW_DEV_LOGIN: "0"
      TRUSTED_PROXIES: ${CADDY_PROXY_IP:-172.30.0.2}
      # 旧单人局新建开关与双人调度间隔：显式透传，.env 设 LEGACY_MATCH_STARTS=0 才真正停开。
      LEGACY_MATCH_STARTS: ${LEGACY_MATCH_STARTS:-1}
      DUEL_SCHEDULER_TICK_MS: ${DUEL_SCHEDULER_TICK_MS:-1000}
      OPENAI_CLIENT_ID: ${OPENAI_CLIENT_ID:-}
      OPENAI_TOKEN_AUTH_METHOD: ${OPENAI_TOKEN_AUTH_METHOD:-none}
      OPENAI_CLIENT_SECRET: ${OPENAI_CLIENT_SECRET:-}
      ADMIN_OPENAI_SUBJECTS: ${ADMIN_OPENAI_SUBJECTS:-}
      LINUXDO_CLIENT_ID: ${LINUXDO_CLIENT_ID:-}
      LINUXDO_CLIENT_SECRET: ${LINUXDO_CLIENT_SECRET:-}
      LINUXDO_TOKEN_AUTH_METHOD: ${LINUXDO_TOKEN_AUTH_METHOD:-client_secret_basic}
      ADMIN_LINUXDO_SUBJECTS: ${ADMIN_LINUXDO_SUBJECTS:-}
    volumes:
      - game-data:/app/data
    networks:
      - backend
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    networks:
      backend:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.0.2}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
networks:
  backend:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.0.0/24}
volumes:
  game-data:
  caddy-data:
  caddy-config:
