services:
  game:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      DATABASE_PATH: /app/data/asteria.sqlite
      ALLOW_DEV_LOGIN: "0"
      OPENAI_CLIENT_ID: ${OPENAI_CLIENT_ID:-}
      OPENAI_TOKEN_AUTH_METHOD: ${OPENAI_TOKEN_AUTH_METHOD:-none}
      OPENAI_CLIENT_SECRET: ${OPENAI_CLIENT_SECRET:-}
      ADMIN_OPENAI_SUBJECTS: ${ADMIN_OPENAI_SUBJECTS:-}
    volumes:
      - game-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  game-data:
  caddy-data:
  caddy-config:
